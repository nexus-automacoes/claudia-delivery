<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudia Delivery - Gerador de Arte do Cardapio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
      border-bottom: 1px solid #2a2a2a;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: #fff;
    }

    .header .badge {
      background: #D9261C;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; padding: 16px; }
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px;
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title .badge-hoje {
      background: #D9261C;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      letter-spacing: 1px;
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #222;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 4px 8px;
      transition: border-color 0.2s;
    }

    .item-row:hover { border-color: #D9261C; }

    .item-handle {
      color: #555;
      cursor: grab;
      font-size: 16px;
      padding: 4px;
      user-select: none;
    }

    .item-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      padding: 10px 4px;
      outline: none;
    }

    .item-input::placeholder { color: #555; }

    .item-remove {
      background: none;
      border: none;
      color: #666;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .item-remove:hover { color: #D9261C; background: rgba(217,38,28,0.1); }

    .paste-section {
      margin-bottom: 20px;
    }

    .paste-section label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #999;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .paste-area {
      width: 100%;
      min-height: 100px;
      background: #222;
      border: 2px dashed #333;
      border-radius: 10px;
      color: #e0e0e0;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 12px;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
    }

    .paste-area:focus { border-color: #D9261C; }
    .paste-area::placeholder { color: #555; }

    .btn-importar {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #e0e0e0;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-importar:hover { background: #333; border-color: #D9261C; color: #fff; }

    .separador {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #444;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .separador::before, .separador::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #333;
    }

    .btn-add {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 2px dashed #333;
      border-radius: 10px;
      color: #666;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .btn-add:hover { border-color: #D9261C; color: #D9261C; }

    .btn-gerar {
      width: 100%;
      padding: 16px;
      background: #D9261C;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-gerar:hover:not(:disabled) { background: #b81f17; transform: translateY(-1px); }
    .btn-gerar:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      display: none;
    }

    .status.ok { display: block; background: rgba(72,187,120,0.15); color: #48BB78; border: 1px solid rgba(72,187,120,0.3); }
    .status.err { display: block; background: rgba(245,101,101,0.15); color: #F56565; border: 1px solid rgba(245,101,101,0.3); }

    .updated-at {
      margin-top: 12px;
      font-size: 12px;
      color: #555;
    }

    .preview-container {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .preview-placeholder {
      text-align: center;
      color: #444;
      font-size: 15px;
    }

    .preview-placeholder .icon { font-size: 48px; margin-bottom: 12px; }

    .preview-img {
      width: 100%;
      height: auto;
      display: none;
      border-radius: 12px;
    }

    .btn-download {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: #222;
      border: 1px solid #333;
      border-radius: 12px;
      color: #e0e0e0;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-download:hover { background: #2a2a2a; border-color: #D9261C; color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Claudia Delivery</h1>
    <span class="badge">Gerador de Arte</span>
  </div>

  <div class="container">
    <!-- Editor Column -->
    <div class="card">
      <div class="card-title">
        <span>&#127869;&#65039; Itens do Cardapio</span>
        <span class="badge-hoje">HOJE</span>
      </div>

      <div class="paste-section">
        <label>Colar lista completa</label>
        <textarea class="paste-area" id="pasteArea" placeholder="Cole sua lista aqui, um item por linha...&#10;&#10;Ex:&#10;Arroz ou galinhada&#10;Feijao&#10;Bife acebolado&#10;Macarrao"></textarea>
        <button class="btn-importar" onclick="importarLista()">Importar lista</button>
      </div>

      <div class="separador">ou edite individualmente</div>

      <div class="items-list" id="itemsList"></div>

      <button class="btn-add" onclick="adicionarItem()">+ Adicionar item</button>

      <button class="btn-gerar" id="btnGerar" onclick="gerarArte()">
        <span class="spinner" id="spinner"></span>
        <span id="btnTexto">&#10024; Gerar Arte</span>
      </button>

      <div class="status" id="status"></div>
      <div class="updated-at" id="updatedAt"></div>
    </div>

    <!-- Preview Column -->
    <div class="card">
      <div class="card-title">&#128444;&#65039; Preview da Arte</div>

      <div class="preview-container">
        <div class="preview-placeholder" id="placeholder">
          <div class="icon">&#127912;</div>
          <div>Edite o cardapio ao lado e clique em "Gerar Arte"</div>
        </div>
        <img class="preview-img" id="previewImg" alt="Preview do cardapio">
      </div>

      <a class="btn-download" id="btnDownload" download="cardapio_hoje.png">
        &#11015;&#65039; Baixar PNG
      </a>
    </div>
  </div>

  <script>
    let cardapioAtual = [];

    async function carregarCardapio() {
      try {
        const res = await fetch('/admin/cardapio/dados');
        const data = await res.json();
        cardapioAtual = data.itens || [];
        renderizarLista();
        if (data.updatedAt) {
          const d = new Date(data.updatedAt);
          document.getElementById('updatedAt').textContent =
            'Ultima atualizacao: ' + d.toLocaleDateString('pt-BR') + ' as ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
      } catch (err) {
        mostrarStatus('Erro ao carregar cardapio: ' + err.message, 'err');
      }
    }

    function renderizarLista() {
      const list = document.getElementById('itemsList');
      list.innerHTML = '';

      cardapioAtual.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML =
          '<span class="item-handle">\u2807</span>' +
          '<input class="item-input" type="text" value="' + escapeHtml(item) + '" placeholder="Nome do item..." oninput="cardapioAtual[' + i + '] = this.value">' +
          '<button class="item-remove" onclick="removerItem(' + i + ')">&times;</button>';
        list.appendChild(row);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function importarLista() {
      const texto = document.getElementById('pasteArea').value;
      if (!texto.trim()) return;

      // Quebra por linhas, remove emojis, limpa espacos extras
      const itens = texto.split('\n')
        .map(function(linha) {
          return linha
            .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{200D}]/gu, '')
            .replace(/^[\s\-\*\.\d\)]+/, '')
            .trim();
        })
        .filter(function(l) { return l.length > 0; });

      if (itens.length === 0) {
        mostrarStatus('Nenhum item encontrado no texto colado.', 'err');
        return;
      }

      cardapioAtual = itens;
      renderizarLista();
      document.getElementById('pasteArea').value = '';
      mostrarStatus(itens.length + ' itens importados!', 'ok');
    }

    function adicionarItem() {
      cardapioAtual.push('');
      renderizarLista();
      const inputs = document.querySelectorAll('.item-input');
      if (inputs.length > 0) inputs[inputs.length - 1].focus();
    }

    function removerItem(index) {
      cardapioAtual.splice(index, 1);
      renderizarLista();
    }

    async function gerarArte() {
      const itens = cardapioAtual.filter(function(i) { return i.trim() !== ''; });
      if (itens.length === 0) {
        mostrarStatus('Adicione pelo menos um item ao cardapio.', 'err');
        return;
      }

      setBotaoCarregando(true);
      document.getElementById('status').style.display = 'none';

      try {
        const res = await fetch('/admin/cardapio/gerar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itens: itens })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.erro || 'Erro ao gerar arte');
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        const img = document.getElementById('previewImg');
        img.src = url;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';

        const btnDown = document.getElementById('btnDownload');
        btnDown.href = url;
        btnDown.style.display = 'block';

        const now = new Date();
        document.getElementById('updatedAt').textContent =
          'Ultima atualizacao: ' + now.toLocaleDateString('pt-BR') + ' as ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        mostrarStatus('Arte gerada com sucesso!', 'ok');
      } catch (err) {
        mostrarStatus('Erro: ' + err.message, 'err');
      } finally {
        setBotaoCarregando(false);
      }
    }

    function setBotaoCarregando(loading) {
      const btn = document.getElementById('btnGerar');
      const spinner = document.getElementById('spinner');
      const texto = document.getElementById('btnTexto');
      btn.disabled = loading;
      spinner.style.display = loading ? 'inline-block' : 'none';
      texto.textContent = loading ? 'Gerando...' : '\u2728 Gerar Arte';
    }

    function mostrarStatus(msg, tipo) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + tipo;
    }

    // Load on init
    carregarCardapio();
  </script>
</body>
</html>
